<section class="results panel" aria-label="Result rows">
  <div class="results__head">
    <h2 class="results__title">
      Rows
      <span class="results__count" data-testid="row-count">
        @if (dataSource.filter) {
          {{ dataSource.filteredData.length }} of {{ rows().length }}
        } @else {
          {{ rows().length }}
        }
        @if (truncated()) {
          (limit reached)
        }
      </span>
    </h2>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="results__filter">
      <mat-label>Filter rows</mat-label>
      <input matInput (input)="applyFilter($event)" data-testid="filter-input" />
    </mat-form-field>
    <button mat-stroked-button type="button" (click)="exportCsv()" data-testid="export-button">Export CSV</button>
  </div>

  <div class="results__scroll">
    <table mat-table [dataSource]="dataSource" matSort class="grid">
      @for (col of columns(); track $index; let i = $index) {
        <ng-container [matColumnDef]="'c' + i">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            [class.num]="numericColumns()[i]"
            [arrowPosition]="numericColumns()[i] ? 'before' : 'after'"
          >
            {{ col }}
          </th>
          <td mat-cell *matCellDef="let row" [class.num]="numericColumns()[i]" [class.null-cell]="row[i] === null">
            {{ row[i] | cellValue }}
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="columnIds(); sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: columnIds()"></tr>
      <tr class="mat-mdc-row" *matNoDataRow>
        <td class="mat-mdc-cell no-match" [attr.colspan]="columnIds().length">No rows match this filter.</td>
      </tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" [pageSize]="10" showFirstLastButtons aria-label="Pages of rows" />
</section>
